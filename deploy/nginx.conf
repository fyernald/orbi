# nginx site for orbi.study. Installed once on the VPS (see docs/deployment.md).
# certbot adds the HTTPS part to this file on the server by itself.

# The app lives only on orbi.study: the login cookie and the allowed origin are that address.
# So every www request is sent there, with its path kept.
server {
	listen 80;
	listen [::]:80;
	server_name www.orbi.study;

	return 301 https://orbi.study$request_uri;
}

server {
	listen 80;
	listen [::]:80;
	server_name orbi.study;

	client_max_body_size 20m;

	# after one visit, browsers use only HTTPS for a year (they ignore it over plain HTTP)
	add_header Strict-Transport-Security "max-age=31536000" always;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	# replaced, not appended: Better Auth rate-limits by this address, so the browser must not be able to set it
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;

	location /api/ {
		proxy_pass http://127.0.0.1:3101;
	}

	location / {
		proxy_pass http://127.0.0.1:3100;
	}
}
