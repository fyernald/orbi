name: CI

# Checks that the code itself works. The "Repo checks" workflow only checks the PR title and files.
# This workflow must pass before a pull request can be merged (set as a required check in the ruleset).
# On main it also builds the Docker images and deploys them to the VPS (see docs/deployment.md).
on:
  pull_request:
  push:
    branches: [main]
  # Lets you redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the older run, except on main so a deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version is read from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory in a package the apps ship with. Lower ones
      # are read in Dependabot's pull requests (pnpm-workspace.yaml overrides fix some).
      - name: Check the dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Show the coverage
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build

  images:
    name: Build ${{ matrix.app }} image
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # the browser's Sentry settings are put into the client build; the server ignores them
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orbi-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orbi-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to VPS
    needs: images
    # Turned on with the DEPLOY_ENABLED repository variable once the VPS is set up.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n' "$HOST" "$USER" "$PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/config

      - name: Copy deploy files
        # the backup scripts go to orbi/backup/, where cron runs them (see docs/deployment.md)
        run: scp -r deploy/compose.yml deploy/backup vps:orbi/

      - name: Start the new version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh vps "docker login ghcr.io -u $ACTOR --password-stdin"
          ssh vps "cd orbi && export IMAGE_TAG=$IMAGE_TAG && docker compose pull && docker compose up -d --wait --wait-timeout 120 --remove-orphans"

      # The VPS also runs other projects, so only Orbi's old images are removed:
      # the ones with the source label the images job sets.
      - name: Clean up
        if: always()
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: ssh vps "docker logout ghcr.io; docker image prune -af --filter label=org.opencontainers.image.source=$SOURCE" || true
