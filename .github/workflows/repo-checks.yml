name: Repo checks

# Runs on every pull request. These checks do not depend on the tech stack.
# Only the PR title is checked, not each commit: "Squash and merge" turns the PR into one commit named after the title.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  # Allowed types: feat, fix, docs, style, refactor, test, chore
  TITLE_PATTERN: '^(feat|fix|docs|style|refactor|test|chore)(\([a-z0-9._-]+\))?!?: [^ ].*$'
  MAX_TITLE_LENGTH: "72"
  MAX_FILE_BYTES: "5242880"

jobs:
  pull-request:
    name: PR title and files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the PR title and issue link
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=0

          # 1. The PR title becomes the commit message on main.
          if ! [[ "$PR_TITLE" =~ $TITLE_PATTERN ]]; then
            echo "::error::PR title must look like 'feat: add login form' (types: feat, fix, docs, style, refactor, test, chore). Current title: \"$PR_TITLE\""
            failed=1
          elif [ "${#PR_TITLE}" -gt "$MAX_TITLE_LENGTH" ]; then
            echo "::error::PR title is too long (max $MAX_TITLE_LENGTH characters): \"$PR_TITLE\""
            failed=1
          fi

          # 2. New features and bug fixes must be linked to an issue (for example: Closes #12).
          if [[ "$PR_TITLE" =~ ^(feat|fix) ]]; then
            if ! printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(es|ed)?|resolve[sd]?|refs?) +#[0-9]+'; then
              echo "::error::feat and fix pull requests must link an issue in the description, for example 'Closes #12'."
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "PR title and issue link look good."

      - name: Check files changed in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0

          # 1. Real secret files must never be committed (.env.example is allowed).
          secrets=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$' || true)
          if [ -n "$secrets" ]; then
            echo "::error::Secret files are committed: $secrets (remove them with 'git rm --cached <file>' and rotate any exposed keys)"
            failed=1
          fi

          # 2. Leftover merge conflict markers.
          if git diff --check "$BASE_SHA...$HEAD_SHA" | grep -q 'leftover conflict marker'; then
            echo "::error::Merge conflict markers (<<<<<<<, =======, >>>>>>>) were left in the code."
            failed=1
          fi

          # 3. Very large files.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt "$MAX_FILE_BYTES" ]; then
              echo "::error::File is larger than 5 MB: $f"
              failed=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA")

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "File checks passed."
