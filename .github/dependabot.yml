version: 2
updates:
  # Keeps the actions used in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Keeps the packages of the whole pnpm workspace up to date.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stay on the same Node.js version as .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keeps the images in docker-compose.yml up to date.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Big Postgres upgrades need a manual database move.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
